# Compila el proyecto con Visual Prolog 11 Personal Edition en un runner
# Windows y ejecuta los casos de prueba. La salida queda en el log del paso
# "Ejecutar los casos de prueba" y en el artefacto "salida" (incluye el .exe).
name: compilar
on:
  push:
  workflow_dispatch:
jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y extraer Visual Prolog 11 PE
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.visual-prolog.com/download/vippe/vip1112.msi -OutFile vip.msi -UserAgent "Mozilla/5.0"
          Start-Process msiexec.exe -Wait -ArgumentList '/a', "$PWD\vip.msi", '/qn', "TARGETDIR=$PWD\vip"
      - name: Compilar
        shell: pwsh
        run: |
          $b = Get-ChildItem -Recurse vip -Filter vipBuilder.exe | Select-Object -First 1
          & $b.FullName /build /platform x64 rcyr.vipprj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ejecutar los casos de prueba
        shell: pwsh
        run: |
          "`n" | & .\exe64\rcyr.exe | Tee-Object -FilePath salida.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salida
          path: |
            salida.txt
            exe64/rcyr.exe
